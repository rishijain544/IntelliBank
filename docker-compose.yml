services:
  # PostgreSQL profile. The app defaults to SQLite, so this is only needed when
  # you want the production-like database. Enable with:
  #   docker compose up -d
  #   DATABASE_URL=postgresql+psycopg://smartbank:smartbank@localhost:5432/smartbank
  postgres:
    image: postgres:17-alpine
    container_name: smartbank-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartbank
      POSTGRES_PASSWORD: smartbank
      POSTGRES_DB: smartbank
      # Deterministic collation so ORDER BY matches across machines.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartbank -d smartbank"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional. Without it the backend uses an in-process rate limiter, which is
  # fine for a single worker but per-worker (and therefore ineffective) when
  # running multiple uvicorn processes.
  redis:
    image: redis:8-alpine
    container_name: smartbank-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
